<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexDrop - Premium</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="dark-mode">
    <!-- Animated Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    
    <header class="glass-header">
        <div class="logo-container">
            <h1>NexDrop</h1>
            <p class="tagline">Seamless Wireless Transfer</p>
        </div>
        <button id="theme-toggle" class="theme-toggle-button" aria-label="Toggle theme">
            <span id="theme-icon">☀️</span>
        </button>
    </header>

    <main>
        <section id="upload-section" class="glass-card">
            <div id="section-header-with-button" class="header-container">
                <h2><span class="gradient-text">Drop & Send</span></h2>
                <button id="paste-button" class="icon-button glow-btn" title="Paste from Clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 2h-4.18C14.4 1.18 13.23 0.5 12 0.5S9.6 1.18 9.18 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2ZM12 2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM19 20H5V4h2v3h10V4h2v16Z" />
                    </svg>
                </button>
            </div>
            <div id="drop-zone" class="animated-border">
                <div class="drop-zone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    <p>Drag & drop files here or click to browse</p>
                </div>
                <input type="file" id="file-input" multiple>
            </div>
            <div id="upload-progress-container"></div>
        </section>

        <section id="files-section" class="glass-card">
            <div id="files-header-container" class="header-container">
                <h2><span class="gradient-text">Your Files</span></h2>
                <div id="files-actions">
                    <button id="download-all-zip-button" class="glow-btn" style="display: none;">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download All
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table id="files-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all-checkbox"></th>
                            <th>Name</th>
                            <th>Size</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- File rows added via JS -->
                    </tbody>
                </table>
            </div>
            <p id="no-files-message" style="display:none;">
                <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <br>No files yet. Upload something to see it here!
            </p>
        </section>
    </main>

    <footer>
        <p>NexDrop &copy; 2026 • Powered by RONESIRVI</p>
    </footer>

    <!-- Modal -->
    <div id="confirmation-modal-overlay" class="modal-overlay">
        <div class="modal-content glass-card">
            <p id="confirmation-modal-message"></p>
            <div class="modal-checkbox-container">
                <input type="checkbox" id="do-not-ask-again">
                <label for="do-not-ask-again">Don't ask me again</label>
            </div>
            <div class="modal-buttons">
                <button id="modal-confirm-button" class="delete-button glow-btn red-glow">Delete</button>
                <button id="modal-cancel-button" class="glow-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/assets/script.js"></script>
</body>
</html>
